# PR이 생성되거나 다시 열릴 때 Notion DB 행의 상태를 [리뷰중]으로 업데이트하고 PR 링크를 기록합니다.
#
#  PR 오픈 (pull_request.opened, reopened, ready_for_review)
#      └→ [리뷰중] + PR URL 갱신   (pr-update-notion.yml ← 이 파일)
#
# GitHub Secrets: NOTION_API_KEY, NOTION_DATABASE_ID

name: Update Notion on PR opened

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  update-notion-pr:
    name: Update Notion status to in-review
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion page status on PR
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          node -e '
          async function run() {
            const token = (process.env.NOTION_TOKEN || "").trim();
            const databaseId = (process.env.NOTION_DATABASE_ID || "").trim();
            const prBody = process.env.PR_BODY || "";
            const prBranch = process.env.PR_BRANCH || "";
            const prTitle = process.env.PR_TITLE || "";
            const prUrl = process.env.PR_URL || "";

            if (!token || !databaseId) {
              console.error("❌ ERROR: NOTION_API_KEY 또는 NOTION_DATABASE_ID 시크릿이 비어있습니다.");
              process.exit(1);
            }

            console.log(`PR 브랜치: ${prBranch}`);
            console.log(`PR 제목: ${prTitle}`);

            // 1. 이슈 번호 추출
            let issueNumber = null;
            const closesMatch = prBody.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([0-9]+)/i);
            const branchMatch = prBranch.match(/^(?:feat|fix|chore|docs|refactor|style|test)\/([0-9]+)-?/i);
            const titleMatch = prTitle.match(/#([0-9]+)/);

            if (closesMatch) {
              issueNumber = parseInt(closesMatch[1], 10);
              console.log(`PR 본문(Closes #)에서 이슈 #${issueNumber} 감지`);
            } else if (branchMatch) {
              issueNumber = parseInt(branchMatch[1], 10);
              console.log(`브랜치명에서 이슈 #${issueNumber} 감지`);
            } else if (titleMatch) {
              issueNumber = parseInt(titleMatch[1], 10);
              console.log(`PR 제목에서 이슈 #${issueNumber} 감지`);
            }

            if (!issueNumber) {
              console.log("연결된 GitHub 이슈 번호를 찾을 수 없습니다. skip합니다.");
              return;
            }

            // 2. 노션 DB 스키마 조회
            const dbRes = await fetch(`https://api.notion.com/v1/databases/${databaseId}`, {
              method: "GET",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28"
              }
            });
            const dbData = await dbRes.json();
            if (!dbRes.ok) {
              console.error("❌ 노션 DB 조회 실패:", JSON.stringify(dbData, null, 2));
              process.exit(1);
            }
            const dbProps = dbData.properties || {};

            const issueNumPropName = Object.keys(dbProps).find(k => 
              k === "Github 이슈 번호" || k === "이슈 번호" || k === "이슈번호" || (dbProps[k].type === "number" && /이슈|issue|number|번호/i.test(k))
            ) || Object.keys(dbProps).find(k => dbProps[k].type === "number");

            const statusPropName = Object.keys(dbProps).find(k => dbProps[k].type === "status") || "상태";
            const prUrlPropName = Object.keys(dbProps).find(k => 
              k === "PR 링크" || k === "PR링크" || (dbProps[k].type === "url" && /pr|pull/i.test(k))
            ) || Object.keys(dbProps).find(k => dbProps[k].type === "url");

            if (!issueNumPropName) {
              console.error("❌ 노션 DB에서 이슈 번호 컬럼(Number)을 찾을 수 없습니다.");
              process.exit(1);
            }

            console.log(`이슈 번호 #${issueNumber}로 노션 행 검색 중...`);

            // 3. 노션 행 검색
            const queryRes = await fetch(`https://api.notion.com/v1/databases/${databaseId}/query`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                filter: {
                  property: issueNumPropName,
                  number: { equals: issueNumber }
                }
              })
            });

            const queryData = await queryRes.json();
            if (!queryRes.ok) {
              console.error("❌ 노션 검색 실패:", JSON.stringify(queryData, null, 2));
              process.exit(1);
            }

            const page = queryData.results && queryData.results[0];
            if (!page) {
              console.log(`노션에서 이슈 #${issueNumber}에 해당하는 행을 찾을 수 없습니다. skip합니다.`);
              return;
            }

            const pageId = page.id;
            console.log(`노션 페이지 ID: ${pageId}`);

            // 4. 상태 업데이트
            const updateProps = {};
            if (statusPropName && dbProps[statusPropName]) {
              const statusOptions = dbProps[statusPropName].status?.options || [];
              const targetStatus = statusOptions.find(o => o.name === "리뷰중") ? "리뷰중" : "리뷰중";
              updateProps[statusPropName] = { status: { name: targetStatus } };
            }
            if (prUrlPropName) {
              updateProps[prUrlPropName] = { url: prUrl };
            }

            const patchRes = await fetch(`https://api.notion.com/v1/pages/${pageId}`, {
              method: "PATCH",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                properties: updateProps
              })
            });

            const patchData = await patchRes.json();
            if (!patchRes.ok) {
              console.error("❌ 노션 상태 업데이트 실패:", JSON.stringify(patchData, null, 2));
              process.exit(1);
            }

            console.log("✅ 노션 상태 업데이트 완료: 리뷰중");
          }

          run().catch(err => {
            console.error("실행 오류:", err);
            process.exit(1);
          });
          '
