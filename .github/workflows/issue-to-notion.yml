# GitHub Issue가 생성될 때 Notion DB에 새 일감을 자동으로 생성합니다.
# (노션 DB 컬럼명을 자동으로 감지하여 유연하게 매핑합니다)
#
#  이슈 생성 (issues.opened)
#      └→ [시작전] 일감 생성        (issue-to-notion.yml ← 이 파일)
#
# GitHub Secrets: NOTION_API_KEY, NOTION_DATABASE_ID

name: Create Notion page on issue opened

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  create-notion-page:
    name: Create Notion task
    runs-on: ubuntu-latest
    steps:
      - name: Create page in Notion database
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          node -e '
          async function run() {
            const token = (process.env.NOTION_TOKEN || "").trim();
            const databaseId = (process.env.NOTION_DATABASE_ID || "").trim();
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const issueTitle = process.env.ISSUE_TITLE || "";
            const issueUrl = process.env.ISSUE_URL || "";

            if (!token) {
              console.error("❌ ERROR: NOTION_API_KEY 시크릿이 비어있습니다. GitHub Secrets를 확인해주세요.");
              process.exit(1);
            }
            if (!databaseId) {
              console.error("❌ ERROR: NOTION_DATABASE_ID 시크릿이 비어있습니다. GitHub Secrets를 확인해주세요.");
              process.exit(1);
            }

            console.log(`새 이슈 생성됨: #${issueNumber} ${issueTitle}`);

            // 1. 노션 데이터베이스 스키마 조회 (컬럼명 자동 감지)
            const dbRes = await fetch(`https://api.notion.com/v1/databases/${databaseId}`, {
              method: "GET",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28"
              }
            });

            const dbData = await dbRes.json();
            if (!dbRes.ok) {
              console.error("❌ 노션 데이터베이스 접근 실패:", JSON.stringify(dbData, null, 2));
              process.exit(1);
            }

            const dbProps = dbData.properties || {};
            console.log("노션 DB 감지된 컬럼 목록:", Object.keys(dbProps));

            // Title(제목) 컬럼 자동 매칭
            const titlePropName = Object.keys(dbProps).find(k => dbProps[k].type === "title") || "이름";

            // 이슈 번호 컬럼 자동 매칭
            const issueNumPropName = Object.keys(dbProps).find(k => 
              k === "Github 이슈 번호" || k === "이슈 번호" || k === "이슈번호" || (dbProps[k].type === "number" && /이슈|issue|number|번호/i.test(k))
            ) || Object.keys(dbProps).find(k => dbProps[k].type === "number");

            // 상태 컬럼 자동 매칭
            const statusPropName = Object.keys(dbProps).find(k => dbProps[k].type === "status") || "상태";

            // 이슈 링크 컬럼 자동 매칭
            const issueUrlPropName = Object.keys(dbProps).find(k => 
              k === "이슈 링크" || k === "이슈링크" || (dbProps[k].type === "url" && /이슈|issue|github/i.test(k))
            ) || Object.keys(dbProps).find(k => dbProps[k].type === "url");

            // 타입 컬럼 자동 매칭
            const typePropName = Object.keys(dbProps).find(k => 
              k === "타입" || k === "Type" || (dbProps[k].type === "select" && /타입|type/i.test(k))
            );

            // 타입 추출
            const upperTitle = issueTitle.toUpperCase();
            let issueType = null;
            if (upperTitle.startsWith("[FEAT]")) issueType = "Feat";
            else if (upperTitle.startsWith("[FIX]")) issueType = "Fix";
            else if (upperTitle.startsWith("[CHORE]")) issueType = "Chore";
            else if (upperTitle.startsWith("[DOCS]")) issueType = "Docs";
            else if (upperTitle.startsWith("[REFACTOR]")) issueType = "Refactor";

            // 2. 존재하는 컬럼만 안전하게 프로퍼티 구성
            const properties = {
              [titlePropName]: {
                title: [{ text: { content: issueTitle } }]
              }
            };

            if (issueNumPropName) {
              properties[issueNumPropName] = { number: issueNumber };
            }

            if (statusPropName && dbProps[statusPropName]) {
              // 상태 옵션 중 '시작전' 또는 기본 시작 옵션 찾기
              const statusOptions = dbProps[statusPropName].status?.options || [];
              const targetStatus = statusOptions.find(o => o.name === "시작전") ? "시작전" : (statusOptions[0]?.name || "시작전");
              properties[statusPropName] = { status: { name: targetStatus } };
            }

            if (issueUrlPropName) {
              properties[issueUrlPropName] = { url: issueUrl };
            }

            if (typePropName && issueType) {
              properties[typePropName] = { select: { name: issueType } };
            }

            console.log("생성 요청 프로퍼티:", Object.keys(properties));

            // 3. 노션 페이지 생성
            const res = await fetch("https://api.notion.com/v1/pages", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                parent: { database_id: databaseId },
                properties
              })
            });

            const data = await res.json();

            if (!res.ok) {
              console.error("❌ Notion API 실패:", JSON.stringify(data, null, 2));
              process.exit(1);
            }

            console.log("✅ 노션 일감 생성 완료!");
          }

          run().catch(err => {
            console.error("실행 오류:", err);
            process.exit(1);
          });
          '
