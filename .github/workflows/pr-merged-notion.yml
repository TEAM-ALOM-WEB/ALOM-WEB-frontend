# PR이 main/develop 브랜치에 머지되었을 때 Notion DB 행의 상태를 [완료]로 업데이트합니다.
#
#  PR 머지 (pull_request.closed + merged)
#      └→ [완료] + PR URL 갱신     (pr-merged-notion.yml ← 이 파일)
#
# GitHub Secrets: NOTION_API_KEY, NOTION_DATABASE_ID

name: Update Notion on PR merged

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  update-notion-merged:
    name: Update Notion status to completed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion page status to completed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          echo "머지된 PR: ${PR_TITLE} (${PR_URL})"

          # 1. PR 본문에서 'Closes #12' 또는 'Fixes #12' 등 이슈 번호 추출
          ISSUE_NUMBER=""
          if [[ "${PR_BODY}" =~ (close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#([0-9]+) ]]; then
            ISSUE_NUMBER="${BASH_REMATCH[3]}"
            echo "PR 본문(Closes #)에서 이슈 #${ISSUE_NUMBER} 감지"
          # 2. 브랜치명에서 'feat/12-...' 형식의 이슈 번호 추출
          elif [[ "${PR_BRANCH}" =~ ^(feat|fix|chore|docs|refactor|style|test)/([0-9]+)-? ]]; then
            ISSUE_NUMBER="${BASH_REMATCH[2]}"
            echo "브랜치명에서 이슈 #${ISSUE_NUMBER} 감지"
          # 3. PR 제목에서 '#12' 형식의 이슈 번호 추출
          elif [[ "${PR_TITLE}" =~ \#([0-9]+) ]]; then
            ISSUE_NUMBER="${BASH_REMATCH[1]}"
            echo "PR 제목에서 이슈 #${ISSUE_NUMBER} 감지"
          fi

          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "연결된 GitHub 이슈 번호를 찾을 수 없습니다. skip합니다."
            exit 0
          fi

          echo "이슈 번호 #${ISSUE_NUMBER}로 노션 행 검색 중..."

          # 이슈 번호로 노션 행 검색
          QUERY_JSON=$(jq -n \
            --argjson number "$ISSUE_NUMBER" \
            '{
              filter: {
                property: "Github 이슈 번호",
                number: { equals: $number }
              }
            }')

          QUERY_RESPONSE=$(curl -sS \
            -X POST "https://api.notion.com/v1/databases/${NOTION_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$QUERY_JSON")

          PAGE_ID=$(echo "$QUERY_RESPONSE" | jq -r '.results[0].id // empty')

          if [ -z "$PAGE_ID" ]; then
            echo "노션에서 이슈 #${ISSUE_NUMBER}에 해당하는 행을 찾을 수 없습니다. skip합니다."
            exit 0
          fi

          echo "노션 페이지 ID: ${PAGE_ID}"

          # 노션 상태를 '완료'로 업데이트
          PATCH_JSON=$(jq -n \
            --arg pr_url "$PR_URL" \
            '{
              properties: {
                "상태": { status: { name: "완료" } },
                "PR 링크": { url: $pr_url }
              }
            }')

          HTTP_CODE=$(curl -sS -o /tmp/notion_merge_patch.json -w "%{http_code}" \
            -X PATCH "https://api.notion.com/v1/pages/${PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$PATCH_JSON")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Notion API failed with HTTP $HTTP_CODE"
            cat /tmp/notion_merge_patch.json

            # 혹시 "PR 링크" 속성이 노션 DB에 없는 경우 "상태"만 업데이트
            if grep -q "PR 링크" /tmp/notion_merge_patch.json; then
              echo "PR 링크 속성 제외 후 상태만 업데이트 시도..."
              FALLBACK_PATCH=$(jq -n '{ properties: { "상태": { status: { name: "완료" } } } }')
              HTTP_CODE=$(curl -sS -o /tmp/notion_merge_retry.json -w "%{http_code}" \
                -X PATCH "https://api.notion.com/v1/pages/${PAGE_ID}" \
                -H "Authorization: Bearer ${NOTION_TOKEN}" \
                -H "Notion-Version: 2022-06-28" \
                -H "Content-Type: application/json" \
                -d "$FALLBACK_PATCH")

              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "재시도 실패 (HTTP $HTTP_CODE):"
                cat /tmp/notion_merge_retry.json
                exit 1
              fi
            else
              exit 1
            fi
          fi

          echo "노션 상태 업데이트 완료: 완료"
          cat /tmp/notion_merge_patch.json || cat /tmp/notion_merge_retry.json
