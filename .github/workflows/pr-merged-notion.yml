# PR이 main/develop 브랜치에 머지되었을 때 Notion DB 행의 상태를 [완료]로 업데이트합니다.
#
#  PR 머지 (pull_request.closed + merged)
#      └→ [완료] + PR URL 갱신     (pr-merged-notion.yml ← 이 파일)
#
# GitHub Secrets: NOTION_API_KEY, NOTION_DATABASE_ID

name: Update Notion on PR merged

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  update-notion-merged:
    name: Update Notion status to completed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion page status to completed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          node -e '
          async function run() {
            const token = (process.env.NOTION_TOKEN || "").trim();
            const databaseId = (process.env.NOTION_DATABASE_ID || "").trim();
            const prBody = process.env.PR_BODY || "";
            const prBranch = process.env.PR_BRANCH || "";
            const prTitle = process.env.PR_TITLE || "";
            const prUrl = process.env.PR_URL || "";

            if (!token || !databaseId) {
              console.error("❌ ERROR: NOTION_API_KEY 또는 NOTION_DATABASE_ID 시크릿이 비어있습니다.");
              process.exit(1);
            }

            console.log(`머지된 PR: ${prTitle} (${prUrl})`);

            // 1. 이슈 번호 추출
            let issueNumber = null;
            const closesMatch = prBody.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([0-9]+)/i);
            const branchMatch = prBranch.match(/^(?:feat|fix|chore|docs|refactor|style|test)\/([0-9]+)-?/i);
            const titleMatch = prTitle.match(/#([0-9]+)/);

            if (closesMatch) {
              issueNumber = parseInt(closesMatch[1], 10);
              console.log(`PR 본문(Closes #)에서 이슈 #${issueNumber} 감지`);
            } else if (branchMatch) {
              issueNumber = parseInt(branchMatch[1], 10);
              console.log(`브랜치명에서 이슈 #${issueNumber} 감지`);
            } else if (titleMatch) {
              issueNumber = parseInt(titleMatch[1], 10);
              console.log(`PR 제목에서 이슈 #${issueNumber} 감지`);
            }

            if (!issueNumber) {
              console.log("연결된 GitHub 이슈 번호를 찾을 수 없습니다. skip합니다.");
              return;
            }

            console.log(`이슈 번호 #${issueNumber}로 노션 행 검색 중...`);

            // 2. 노션 행 검색
            const queryRes = await fetch(`https://api.notion.com/v1/databases/${databaseId}/query`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                filter: {
                  property: "Github 이슈 번호",
                  number: { equals: issueNumber }
                }
              })
            });

            const queryData = await queryRes.json();
            if (!queryRes.ok) {
              console.error("❌ 노션 검색 실패:", JSON.stringify(queryData, null, 2));
              process.exit(1);
            }

            const page = queryData.results && queryData.results[0];
            if (!page) {
              console.log(`노션에서 이슈 #${issueNumber}에 해당하는 행을 찾을 수 없습니다. skip합니다.`);
              return;
            }

            const pageId = page.id;
            console.log(`노션 페이지 ID: ${pageId}`);

            // 3. 상태를 '완료'로 업데이트
            const patchRes = await fetch(`https://api.notion.com/v1/pages/${pageId}`, {
              method: "PATCH",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                properties: {
                  "상태": { status: { name: "완료" } },
                  "PR 링크": { url: prUrl }
                }
              })
            });

            const patchData = await patchRes.json();
            if (!patchRes.ok) {
              if (JSON.stringify(patchData).includes("PR 링크")) {
                console.log("PR 링크 속성 제외 후 상태만 완료로 업데이트 시도...");
                const retryRes = await fetch(`https://api.notion.com/v1/pages/${pageId}`, {
                  method: "PATCH",
                  headers: {
                    "Authorization": `Bearer ${token}`,
                    "Notion-Version": "2022-06-28",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    properties: {
                      "상태": { status: { name: "완료" } }
                    }
                  })
                });
                const retryData = await retryRes.json();
                if (!retryRes.ok) {
                  console.error("❌ 노션 상태 업데이트 실패:", JSON.stringify(retryData, null, 2));
                  process.exit(1);
                }
                console.log("✅ 노션 상태 업데이트 완료: 완료");
                return;
              }

              console.error("❌ 노션 상태 업데이트 실패:", JSON.stringify(patchData, null, 2));
              process.exit(1);
            }

            console.log("✅ 노션 상태 업데이트 완료: 완료");
          }

          run().catch(err => {
            console.error("실행 오류:", err);
            process.exit(1);
          });
          '
