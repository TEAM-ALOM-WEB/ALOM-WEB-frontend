# 이슈가 닫히거나 다시 열릴 때 Notion DB 행의 상태를 업데이트합니다.
#
#  이슈 close - not_planned (issues.closed)
#      └→ [취소됨]                 (issue-closed-notion.yml ← 이 파일)
#
#  이슈 close - completed (issues.closed)
#      현재 "완료"  →  skip
#      아니면       →  [완료]       (issue-closed-notion.yml ← 이 파일)
#
#  이슈 reopen (issues.reopened)
#      현재 "취소됨"  →  [시작전]  (issue-closed-notion.yml ← 이 파일)
#
# GitHub Secrets: NOTION_API_KEY, NOTION_DATABASE_ID

name: Update Notion on issue closed or reopened

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read

jobs:
  update-notion:
    name: Update Notion status on issue close or reopen
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion page status
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          node -e '
          async function run() {
            const token = (process.env.NOTION_TOKEN || "").trim();
            const databaseId = (process.env.NOTION_DATABASE_ID || "").trim();
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const issueAction = process.env.ISSUE_ACTION || "";
            const stateReason = process.env.STATE_REASON || "";

            if (!token || !databaseId) {
              console.error("❌ ERROR: NOTION_API_KEY 또는 NOTION_DATABASE_ID 시크릿이 비어있습니다.");
              process.exit(1);
            }

            console.log(`action: ${issueAction}, state_reason: ${stateReason}`);

            if (issueAction !== "reopened" && stateReason !== "not_planned" && stateReason !== "completed") {
              console.log("state_reason이 not_planned / completed 가 아니므로 skip합니다.");
              return;
            }

            // 1. 노션 행 검색
            const queryRes = await fetch(`https://api.notion.com/v1/databases/${databaseId}/query`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                filter: {
                  property: "Github 이슈 번호",
                  number: { equals: issueNumber }
                }
              })
            });

            const queryData = await queryRes.json();
            if (!queryRes.ok) {
              console.error("❌ 노션 검색 실패:", JSON.stringify(queryData, null, 2));
              process.exit(1);
            }

            const page = queryData.results && queryData.results[0];
            if (!page) {
              console.log(`노션에서 이슈 #${issueNumber}에 해당하는 행을 찾을 수 없습니다. skip합니다.`);
              return;
            }

            const pageId = page.id;
            const currentStatus = page.properties["상태"]?.status?.name || "";
            console.log(`노션 페이지 ID: ${pageId}, 현재 상태: ${currentStatus}`);

            let newStatus = "";
            if (issueAction === "reopened") {
              if (currentStatus !== "취소됨") {
                console.log("현재 상태가 \"취소됨\"이 아니므로 skip합니다.");
                return;
              }
              newStatus = "시작전";
            } else if (stateReason === "completed") {
              if (currentStatus === "완료") {
                console.log("이미 완료 상태입니다. skip합니다.");
                return;
              }
              newStatus = "완료";
            } else {
              newStatus = "취소됨";
            }

            console.log(`노션 상태를 "${newStatus}"로 업데이트합니다.`);

            const patchRes = await fetch(`https://api.notion.com/v1/pages/${pageId}`, {
              method: "PATCH",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Notion-Version": "2022-06-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                properties: {
                  "상태": { status: { name: newStatus } }
                }
              })
            });

            const patchData = await patchRes.json();
            if (!patchRes.ok) {
              console.error("❌ 노션 상태 업데이트 실패:", JSON.stringify(patchData, null, 2));
              process.exit(1);
            }

            console.log(`✅ 노션 상태 업데이트 완료: ${newStatus}`);
          }

          run().catch(err => {
            console.error("실행 오류:", err);
            process.exit(1);
          });
          '